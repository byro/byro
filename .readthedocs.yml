# Read the Docs builds the documentation with Zensical (see docs/README.md).
# Both language projects (byro = en, byro-de = de) use this file; the language
# is selected by the READTHEDOCS_LANGUAGE variable in docs/rtd_build.py.
# Older release tags keep their own Sphinx configuration and are not affected.
version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"
  jobs:
    create_environment:
      - python -m venv $READTHEDOCS_VIRTUALENV_PATH
    install:
      - $READTHEDOCS_VIRTUALENV_PATH/bin/python -m pip install -r docs/requirements-zensical.txt
    build:
      html:
        - $READTHEDOCS_VIRTUALENV_PATH/bin/python docs/rtd_build.py
