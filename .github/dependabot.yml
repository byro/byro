version: 2
# Every update gets only the "dependencies" label (no ecosystem labels) and a
# title of the form "chore(deps): bump ...", which the "PR title" check accepts
# and Release Drafter lists under Dependencies.
updates:
  - package-ecosystem: pip
    directory: "/src"
    schedule:
      interval: daily
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 10
    ignore:
    # Django is a range requirement (>=5.2,<5.3) without a lockfile, so
    # Dependabot has no current version to derive update-types from and
    # would only ever widen the range. Ignore by version instead and raise
    # this bound when moving to the next LTS.
    - dependency-name: Django
      versions:
        - ">= 5.3"
    - dependency-name: python
      update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: daily
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: "/src"
    schedule:
      interval: daily
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: daily
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
