name: Stable pointer

# Points the CI-managed branch "stable" (install.sh + stable.env for the byro
# bootstrap and "byroctl update --check") at a release tag. Called by the
# release pipeline (ci-cd.yml) after image and package were published, and run
# by hand to move the pointer deliberately, e.g. away from a broken release
# ("force" allows an older release). See docs/developer/releasing.rst.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to point stable at (vYYYY.M.P)
        required: true
        type: string
      force:
        description: Allow moving stable to an older release
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to point stable at (vYYYY.M.P)
        required: true
        type: string
      force:
        description: Allow moving stable to an older release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-stable:
    name: ⬆ Point stable at ${{ inputs.tag }}
    runs-on: ubuntu-22.04
    concurrency:
      group: stable-branch
      cancel-in-progress: false
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v7
      - name: 🏗 Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: ⬆ Update the stable branch
        env:
          TAG: ${{ inputs.tag }}
        run: .github/scripts/update-stable-branch.sh "$TAG" --image-repo "ghcr.io/${{ github.repository }}" ${{ inputs.force && '--force' || '' }}
