name: Release Drafter

on:
  push:
    branches:
      - main
  # Refreshes the draft when the title or a label (skip-changelog, dependencies)
  # of a pull request changes, e.g. when the title of a merged one is corrected.
  pull_request_target:
    types: [edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}