name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'zensical.*.toml'
      - '.readthedocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'zensical.*.toml'
      - '.readthedocs.yml'
      - '.github/workflows/docs.yml'

jobs:
  parity:
    name: "[Docs] German/English page parity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that docs/de and docs/en cover the same pages
        run: python3 docs/check_parity.py docs

  zensical:
    name: "[Docs] Zensical build ${{ matrix.language }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ de, en ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('docs/requirements-zensical.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-
      - name: Install Zensical
        run: python -m pip install -r docs/requirements-zensical.txt
      - name: Build as Read the Docs would (strict)
        run: python docs/rtd_build.py
        env:
          READTHEDOCS: "True"
          READTHEDOCS_LANGUAGE: ${{ matrix.language }}
          READTHEDOCS_OUTPUT: ${{ runner.temp }}/rtd
          READTHEDOCS_CANONICAL_URL: https://byro.readthedocs.io/${{ matrix.language }}/latest/
      - name: Check local links and assets in the built site
        run: python docs/check_site.py "${{ runner.temp }}/rtd/html"
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.language }}
          path: ${{ runner.temp }}/rtd/html
          retention-days: 7

  links:
    name: "[Docs] External links"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check external links in the Markdown sources
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200..=299,403,429
            --exclude '^https?://(byro\.example\.org|byro\.yourdomain\.com|byro\.mydomain\.com|foo\.bar\.de|localhost|127\.0\.0\.1)'
            --exclude '^https://github\.com/byro/byro/issues/new'
            --exclude-path docs/_build
            'docs/de/**/*.md' 'docs/en/**/*.md' 'docs/README.md'
          fail: true

  spelling:
    name: "[Docs] Spelling (English)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install codespell
        run: python -m pip install codespell==2.4.3
      - name: Check the English tree for typos
        run: codespell --ignore-words docs/codespell-ignore.txt docs/en docs/README.md
