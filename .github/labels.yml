# Quelle der Wahrheit für die Labels des Repositories: sync-labels.yml löscht
# jedes Label, das hier nicht steht. Art (Bug, Feature, Task) steht im Issue
# Type, die Art einer Änderung im Titel des Pull Requests, Bearbeitung in den
# Assignees, Review- und Entwurfsstatus in GitHub selbst.

# Issue-Workflow
- name: needs-triage
  color: 'd876e3'
  description: Needs maintainer triage

- name: good first issue
  color: '7057ff'
  description: Good for newcomers

- name: help wanted
  color: '008672'
  description: Maintainers are looking for contributors

# Pull-Request-Automatisierung
- name: dependencies
  color: '0366d6'
  description: Dependency updates (Dependabot)

- name: skip-changelog
  color: 'eeeeee'
  description: Exclude this PR from release notes
