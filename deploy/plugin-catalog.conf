# byro plugin catalog: what "byroctl plugin add <shortname>" knows about a plugin.
#
# Metadata only. The version is resolved when a plugin is added or updated:
#   source=github  -> the current regular GitHub release of repo, installed by
#                     the commit the release tag points to
#   source=pypi    -> the current release on PyPI, pinned with ==
# Compatibility with byro is declared by the plugin itself
# (dependencies = ["byro>=..."] in its pyproject.toml), not here.
#
# One section per plugin, [shortname] = lower-case letters, digits, hyphens.
# Every key is required, values run to the end of the line, no quotes, no
# inline comments. Linted by .github/scripts/check-plugin-catalog.sh; how to
# add a plugin: docs/developer/releasing.rst, section "Plugin catalog".

[finance-import-bank-files]
name=Bank file importers
description=Imports file-based bank statements
package=byro-finance-import-bank-files
source=github
repo=https://github.com/byro/byro-finance-import-bank-files
