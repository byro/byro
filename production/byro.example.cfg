[filesystem]
data = /var/byro/data
media = /var/byro/data/media
logs = /var/byro/data/logs

[site]
debug = False
url = http://byro.mydomain.com

[database]
name = byro
user = byro
password = byro
host = db
port = 5432

[mail]
from = admin@byro
# by default, this is the IP address of your docker host, as seen from byro
host = MAIL_HOST
port = 25
user = admin
password = something
tls = False
ssl = True

[pgp]
backend = byro.mails.gnupg_backend.GnuPGBackend
home = /var/byro/data/gnupg

[oidc]
# Leave issuer url empty to disable OIDC login
issuer_url = https://auth.example.com/application/o/byro/
client_id = byro
client_secret = change-me
# Restrict login to members of this group (leave empty to allow any authenticated user).
admin_group = byro-admins
# Grant superuser rights to members of this group (leave empty to never grant
# superuser via OIDC; existing local superuser status is then left alone).
superuser_group = byro-superadmins
# Set to true to automatically create a local account for new OIDC users.
auto_create_account = false
# Set to true to re-check admin_group/superuser_group membership on every OIDC
# login and update is_staff/is_superuser to match, instead of only when the
# account is first created. WARNING: if the identity provider ever loses or
# misconfigures superuser_group for everyone (e.g. the group is deleted or
# renamed), every account syncs down to non-superuser on its next login, and
# nobody may be left who can grant superuser rights back through byro itself.
sync_groups = false
# Set to true to skip byro's own MFA challenge for OIDC sessions, if your
# identity provider already enforces MFA. Password logins are unaffected.
mfa_exempt = false
# Claim used as the Django username (default: preferred_username).
username_field = preferred_username
