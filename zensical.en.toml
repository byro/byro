# Zensical configuration for the en documentation tree (docs/en/).
# Build:  zensical build -f zensical.en.toml --strict
# Serve:  zensical serve -f zensical.en.toml
# Both language trees use identical relative paths; only titles and navigation labels differ.

[project]
site_name = "byro documentation"
site_url = "https://byro.readthedocs.io/en/latest/"
site_description = "byro – membership administration for small and medium sized associations"
copyright = '&copy; the byro contributors · This documentation is licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>'
repo_url = "https://github.com/byro/byro"
repo_name = "byro/byro"
edit_uri = "edit/main/docs/en/"
docs_dir = "docs/en"
site_dir = "docs/_build/zensical/en"
use_directory_urls = true
strict = true

nav = [
  { "Getting started" = "index.md" },
  { "Installation" = [
    "installation/index.md",
  ] },
  { "Administration" = [
    "administration/index.md",
  ] },
  { "Configuration" = [
    "configuration/index.md",
  ] },
  { "Usage" = [
    "usage/index.md",
  ] },
  { "Development & API" = [
    "development/index.md",
  ] },
  { "Smoke test (preliminary)" = "smoke-test.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
logo = "img/logo/byro_128.png"
favicon = "img/logo/byro_32.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
