[filesystem]
data = /var/byro/data
media = /var/byro/data/media
logs = /var/byro/data/logs

[locale]
language_code = de

[site]
debug = True
url = http://localhost

[database]
name = byro
user = byro
password = byro
host = db
port = 5432
engine = postgresql

[mail]
from = admin@localhost
host = localhost
port = 25
user = admin
password = something
tls = False
ssl = True

[pgp]
backend = byro.mails.gnupg_backend.GnuPGBackend
home = /var/byro/data/gnupg

[oidc]
# Leave issuer url empty to disable OIDC login
issuer_url = https://auth.example.com/application/o/byro/
client_id = byro
client_secret = change-me
# Members of this group may sign in and get regular access (is_staff). Leave
# empty to allow any user of the identity provider.
staff_group = byro-staff
# Members of this group are superusers (is_superuser). Leave empty to never
# grant superuser rights through OIDC.
superuser_group = byro-superusers
# Set to true to automatically create a local account for new OIDC users.
auto_create_account = false
# false: the groups only set the permissions of a newly created account.
# true: every OIDC login updates is_staff/is_superuser from the groups above
# and also removes them. Keep a local superuser with a password in that case.
sync_groups = false
# Claim used as the Django username (default: preferred_username).
username_field = preferred_username
