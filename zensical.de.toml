# Zensical configuration for the de documentation tree (docs/de/).
# Build:  zensical build -f zensical.de.toml --strict
# Serve:  zensical serve -f zensical.de.toml
# Both language trees use identical relative paths; only titles and navigation labels differ.

[project]
site_name = "byro Dokumentation"
site_url = "https://byro.readthedocs.io/de/latest/"
site_description = "byro – membership administration for small and medium sized associations"
copyright = '&copy; die byro-Mitwirkenden · Diese Dokumentation steht unter <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.de">CC BY-SA 4.0</a>'
repo_url = "https://github.com/byro/byro"
repo_name = "byro/byro"
edit_uri = "edit/main/docs/de/"
docs_dir = "docs/de"
site_dir = "docs/_build/zensical/de"
use_directory_urls = true
strict = true

nav = [
  { "Erste Schritte" = "index.md" },
  { "Installation" = [
    { "Installation" = [
      { "Überblick" = "installation/overview.md" },
      { "Mit byroctl (empfohlen)" = "installation/byroctl.md" },
      { "Mit Docker Compose" = "installation/docker-compose.md" },
      { "Bare Metal" = "installation/bare-metal.md" },
      { "Legacy: production/ (veraltet)" = "installation/legacy-production.md" },
    ] },
  ] },
  { "Administration" = [
    { "Administration" = [
      { "Überblick" = "administration/operations.md" },
      { "Update" = "administration/updating.md" },
      { "Backup und Restore" = "administration/backup-restore.md" },
      { "Management-Befehle" = "administration/management-commands.md" },
      { "Monitoring, Logging und Fehlersuche" = "administration/troubleshooting.md" },
      { "Sicherheits-Baseline" = "administration/security-baseline.md" },
    ] },
  ] },
  { "Konfiguration" = [
    { "Konfiguration" = [
      { "Überblick" = "administration/overview.md" },
      { "Benutzer und Login" = "administration/users-and-login.md" },
      { "Mehr-Faktor-Authentifizierung" = "administration/mfa.md" },
      { "PGP-Mailverschlüsselung" = "administration/pgp.md" },
      { "Einstellungen" = "administration/settings.md" },
      { "Konfigurationsreferenz" = "configuration/reference.md" },
    ] },
  ] },
  { "Benutzerhandbuch" = [
    { "Benutzerhandbuch" = [
      { "Überblick" = "usage/overview.md" },
      { "Mitgliederverwaltung" = [
        { "Überblick" = "usage/member-management.md" },
        { "Mitglieder" = "usage/members.md" },
        { "Mitgliedschaften und Beiträge" = "usage/memberships-and-fees.md" },
      ] },
      { "Finanzen" = [
        { "Überblick" = "usage/finances.md" },
        { "Dokumente" = "usage/documents.md" },
        { "Kommunikation" = "usage/mails.md" },
      ] },
      { "Mitgliederbereich" = [
        { "Mitgliederseite" = "usage/member-page.md" },
      ] },
      { "Mein Konto" = [
        { "Überblick" = "usage/account.md" },
        { "Mehr-Faktor-Authentifizierung" = "usage/mfa.md" },
      ] },
    ] },
  ] },
  { "API & Plugins" = [
    { "API & Plugins" = [
      { "Plugins" = [
        { "Überblick" = "administration/plugins.md" },
        { "Plugin-Verwaltung" = "administration/plugin-management.md" },
      ] },
      { "Plugin-Entwicklung" = [
        { "Überblick" = "development/plugins/overview.md" },
        { "Ein Plugin erstellen" = "development/plugins/creating-a-plugin.md" },
        { "Eigene Mitgliedsdaten" = "development/plugins/member-data.md" },
        { "Bankimporter" = "development/plugins/bank-transaction-importers.md" },
        { "Signalliste" = "development/signals.md" },
      ] },
      { "REST-API" = "development/api.md" },
    ] },
  ] },
  { "Unterstützen" = [
    { "Unterstützen" = [
      { "Überblick" = "development/overview.md" },
      { "Entwicklungs-Setup" = "development/setup.md" },
      { "Mitwirken" = "development/contributing.md" },
      { "An der Dokumentation arbeiten" = "development/documentation.md" },
      { "byro veröffentlichen" = "development/releasing.md" },
    ] },
  ] },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "de"
custom_dir = "docs/overrides/de"
logo = "img/logo/byro_128.png"
favicon = "img/logo/byro_32.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Zum hellen Design wechseln"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Zum dunklen Design wechseln"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Systemeinstellung verwenden"

[project.plugins.mkdocstrings]
handlers.python.paths = ["src"]
handlers.python.options.docstring_style = "sphinx"
handlers.python.options.show_source = false
handlers.python.options.show_root_heading = true
handlers.python.options.show_root_full_path = true
handlers.python.options.heading_level = 3
handlers.python.options.members_order = "source"
handlers.python.options.separate_signature = true
handlers.python.options.show_signature_annotations = true
handlers.python.options.docstring_section_style = "table"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
